<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Falange - Animal Desembaralhado</title>
  <style>
    /* ==============================
       PADRÃO VISUAL FALANGE
       Layout responsivo, limpo, colorido e sem dependências externas.
       ============================== */
    :root {
      --amarelo: #ffd22e;
      --verde: #77c7b3;
      --azul: #16425b;
      --laranja: #ff914d;
      --branco: #ffffff;
      --cinza: #f4f6f8;
      --erro: #d62828;
      --acerto: #16803c;
      --sombra: 0 14px 35px rgba(0,0,0,.18);
      --raio: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--amarelo), var(--verde));
      color: var(--azul);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .app {
      width: min(980px, 100%);
      background: rgba(255,255,255,.96);
      border-radius: var(--raio);
      box-shadow: var(--sombra);
      overflow: hidden;
      border: 4px solid var(--azul);
    }

    header {
      background: var(--azul);
      color: var(--branco);
      padding: 18px 22px;
      text-align: center;
    }

    header h1 { margin: 0; font-size: clamp(1.35rem, 4vw, 2.2rem); }
    header p { margin: 8px 0 0; font-size: clamp(.9rem, 2.5vw, 1.05rem); }

    .painel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      padding: 22px;
      align-items: stretch;
    }

    .card {
      background: var(--cinza);
      border-radius: 20px;
      padding: 18px;
      border: 3px solid rgba(22,66,91,.12);
    }

    .imagemAnimal {
      width: 100%;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--amarelo);
      border-radius: 18px;
      overflow: hidden;
    }

    .imagemAnimal img { width: 100%; height: 100%; max-height: 520px; object-fit: contain; display: block; }

    .infoTopo {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
      font-weight: 800;
    }

    .badge {
      background: var(--amarelo);
      color: var(--azul);
      padding: 10px 14px;
      border-radius: 999px;
      border: 2px solid var(--azul);
    }

    .tempo { font-size: 1.25rem; }
    .tempo.perigo { background: var(--erro); color: white; }

    .embaralhada {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 22px 0;
    }

    .letra {
      width: 46px;
      height: 54px;
      display: grid;
      place-items: center;
      background: var(--branco);
      border: 3px solid var(--azul);
      border-radius: 10px;
      font-size: 1.8rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    label {
      display: block;
      font-weight: 900;
      margin-bottom: 8px;
      font-size: 1.05rem;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 3px solid var(--azul);
      border-radius: 16px;
      font-size: 1.3rem;
      outline: none;
      text-align: center;
      font-weight: 800;
      background: white;
    }

    input:focus { box-shadow: 0 0 0 5px rgba(255,210,46,.65); }

    .botoes { display: flex; gap: 10px; margin-top: 14px; }

    button {
      flex: 1;
      border: none;
      padding: 15px 12px;
      border-radius: 16px;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      color: white;
      background: var(--azul);
      transition: transform .15s ease, opacity .15s ease;
    }

    button:hover { transform: translateY(-2px); }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .reiniciar { background: var(--laranja); }
    .configurar { background: var(--verde); color: var(--azul); border: 2px solid var(--azul); }

    .mensagem {
      min-height: 46px;
      margin-top: 16px;
      padding: 12px;
      border-radius: 14px;
      text-align: center;
      font-weight: 900;
      background: white;
      border: 2px dashed var(--azul);
    }

    .mensagem.ok { color: var(--acerto); border-color: var(--acerto); }
    .mensagem.erro { color: var(--erro); border-color: var(--erro); }

    .barra { width: 100%; background: #ddd; border-radius: 999px; overflow: hidden; height: 16px; margin-top: 14px; }
    .progresso { height: 100%; width: 0%; background: var(--azul); transition: width .25s ease; }

    .final {
      display: none;
      text-align: center;
      padding: 34px 22px;
    }

    .final h2 { font-size: clamp(1.8rem, 5vw, 3rem); margin: 0 0 12px; color: var(--acerto); }
    .final p { font-size: 1.2rem; font-weight: 800; }

    @media (max-width: 780px) {
      .painel { grid-template-columns: 1fr; padding: 14px; }
      .imagemAnimal { min-height: 260px; }
      .letra { width: 38px; height: 46px; font-size: 1.45rem; }
      .botoes { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Jogo Falange de desembaralhar animais em espanhol">
    <header>
      <h1>🐾 Falange Animal Typing</h1>
      <p>Observe a imagem, desembaralhe as letras e escreva o nome do animal em espanhol no tempo configurado.</p>
    </header>

    <section class="painel" id="telaJogo">
      <div class="card imagemAnimal">
        <img id="animalImg" alt="Imagem do animal da rodada" />
      </div>

      <div class="card">
        <div class="infoTopo">
          <span class="badge" id="fase">Animal 1/20</span>
          <span class="badge tempo" id="tempo">10s</span>
        </div>

        <div class="barra" aria-label="Progresso da atividade">
          <div class="progresso" id="progresso"></div>
        </div>

        <div class="embaralhada" id="letras" aria-label="Letras embaralhadas"></div>

        <label for="resposta">Digite o nome correto:</label>
        <input id="resposta" type="text" placeholder="Escreva aqui..." autocomplete="off" />

        <div class="botoes">
          <button id="btnConferir">CONFERIR</button>
          <button class="configurar" id="btnConfigTempo">⏱️ ALTERAR TEMPO</button>
          <button class="reiniciar" id="btnReiniciar">🔄 INICIAR NOVAMENTE</button>
        </div>

        <div class="mensagem" id="mensagem">Comece pelo primeiro animal. Boa sorte!</div>
      </div>
    </section>

    <section class="final" id="telaFinal">
      <h2>✅ Atividade concluída!</h2>
      <p>Parabéns! Você desembaralhou todos os animais.</p>
      <button class="reiniciar" onclick="reiniciarJogo()">JOGAR NOVAMENTE</button>
    </section>
  </main>

    /* =========================================================
       VARIÁVEIS DE CONTROLE
       indiceAtual: guarda em qual animal o aluno está.
       tempoMaximo: tempo escolhido para cada card. O padrão é 10 segundos.
       tempoRestante: contador regressivo da rodada atual.
       relogio: guarda o setInterval para poder parar/reiniciar.
       ========================================================= */
    let indiceAtual = 0;
    let tempoMaximo = 10;
    let tempoRestante = tempoMaximo;
    let relogio = null;
    let jogoBloqueado = false; // trava a rodada quando o aluno erra ou quando o tempo acaba.

    const animalImg = document.getElementById('animalImg');
    const fase = document.getElementById('fase');
    const tempo = document.getElementById('tempo');
    const letras = document.getElementById('letras');
    const resposta = document.getElementById('resposta');
    const mensagem = document.getElementById('mensagem');
    const progresso = document.getElementById('progresso');
    const telaJogo = document.getElementById('telaJogo');
    const telaFinal = document.getElementById('telaFinal');

    document.getElementById('btnConferir').addEventListener('click', conferirResposta);
    document.getElementById('btnReiniciar').addEventListener('click', reiniciarJogo);
    document.getElementById('btnConfigTempo').addEventListener('click', alterarTempoComSenha);
    resposta.addEventListener('keydown', (e) => { if (e.key === 'Enter') conferirResposta(); });

    /* Remove acentos e padroniza a escrita.
       Assim, "leon" também será aceito para "león". */
    function normalizar(texto) {
      return texto.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    }

    /* Mostra o animal atual na tela e reinicia o tempo da rodada. */
    function carregarRodada() {
      jogoBloqueado = false;
      resposta.disabled = false;
      document.getElementById('btnConferir').disabled = false;
      const animal = animais[indiceAtual];
      animalImg.src = animal.image;
      fase.textContent = `Animal ${indiceAtual + 1}/${animais.length}`;
      progresso.style.width = `${(indiceAtual / animais.length) * 100}%`;
      resposta.value = '';
      resposta.focus();
      mensagem.className = 'mensagem';
      mensagem.textContent = 'Desembaralhe as letras e escreva o nome do animal.';

      letras.innerHTML = '';
      [...animal.scrambled].forEach(l => {
        const caixa = document.createElement('span');
        caixa.className = 'letra';
        caixa.textContent = l;
        letras.appendChild(caixa);
      });

      iniciarTempo();
    }

    /* Contador configurável. Se zerar, o jogo para e pede para iniciar novamente. */
    function iniciarTempo() {
      clearInterval(relogio);
      tempoRestante = tempoMaximo;
      atualizarTempo();

      relogio = setInterval(() => {
        tempoRestante--;
        atualizarTempo();

        if (tempoRestante <= 0) {
          pararParaReiniciar('⏰ Tempo esgotado! Clique em INICIAR NOVAMENTE.');
        }
      }, 1000);
    }

    /* Atualiza a aparência do cronômetro. */
    function atualizarTempo() {
      tempo.textContent = `${tempoRestante}s`;
      tempo.classList.toggle('perigo', tempoRestante <= Math.min(3, Math.ceil(tempoMaximo / 3)));
    }

    /* Botão protegido por senha para alterar o tempo dos cards. */
    function alterarTempoComSenha() {
      const senha = prompt('Digite a senha para alterar o tempo:');

      if (senha === null) return;

      if (senha !== 'FALANGE123') {
        mensagem.className = 'mensagem erro';
        mensagem.textContent = '🔒 Senha incorreta. O tempo não foi alterado.';
        return;
      }

      const novoTempo = Number(prompt('Digite o novo tempo de cada card em segundos:', tempoMaximo));

      if (!Number.isInteger(novoTempo) || novoTempo < 3 || novoTempo > 120) {
        mensagem.className = 'mensagem erro';
        mensagem.textContent = 'Informe um tempo inteiro entre 3 e 120 segundos.';
        return;
      }

      tempoMaximo = novoTempo;
      tempoRestante = tempoMaximo;
      atualizarTempo();

      mensagem.className = 'mensagem ok';
      mensagem.textContent = `⏱️ Tempo alterado para ${tempoMaximo} segundos por card.`;

      if (!jogoBloqueado && telaJogo.style.display !== 'none') {
        iniciarTempo();
        resposta.focus();
      }
    }

    /* Confere a resposta.
       Acertou: vai para o próximo animal.
       Errou: volta para o primeiro animal. */
    function conferirResposta() {
      if (jogoBloqueado) return;
      const correta = normalizar(animais[indiceAtual].answer);
      const digitada = normalizar(resposta.value);

      if (!digitada) {
        mensagem.className = 'mensagem erro';
        mensagem.textContent = 'Digite uma resposta antes de conferir.';
        resposta.focus();
        return;
      }

      if (digitada === correta) {
        clearInterval(relogio);
        mensagem.className = 'mensagem ok';
        mensagem.textContent = '✅ Acertou! Próximo animal...';
        indiceAtual++;

        if (indiceAtual >= animais.length) {
          setTimeout(concluirJogo, 700);
        } else {
          setTimeout(carregarRodada, 700);
        }
      } else {
        pararParaReiniciar('❌ Você errou! Clique em INICIAR NOVAMENTE.');
      }
    }

    /* Para o jogo sem reiniciar automaticamente.
       O aluno só volta ao início quando clicar no botão INICIAR NOVAMENTE. */
    function pararParaReiniciar(texto) {
      clearInterval(relogio);
      jogoBloqueado = true;
      resposta.disabled = true;
      document.getElementById('btnConferir').disabled = true;
      mensagem.className = 'mensagem erro';
      mensagem.textContent = texto;
      document.getElementById('btnReiniciar').focus();
    }

    /* Reinicia a atividade inteira. */
    function reiniciarJogo() {
      clearInterval(relogio);
      jogoBloqueado = false;
      resposta.disabled = false;
      document.getElementById('btnConferir').disabled = false;
      indiceAtual = 0;
      telaFinal.style.display = 'none';
      telaJogo.style.display = 'grid';
      carregarRodada();
    }

    /* Tela final após terminar todos os 20 animais. */
    function concluirJogo() {
      clearInterval(relogio);
      progresso.style.width = '100%';
      telaJogo.style.display = 'none';
      telaFinal.style.display = 'block';
    }

    carregarRodada();
  </script>
